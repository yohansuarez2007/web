<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrusel de Colombia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eee;
      margin: 0;
      padding: 20px;
    }

    .carrusel {
      width: 100%;
      max-width: 800px;
      margin: auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      position: relative;
      background-color: #fff;
    }

    .slides {
      display: flex;
      transition: transform 0.5s ease;
      width: 100%;
    }

    .slide {
      min-width: 100%;
      box-sizing: border-box;
    }

    .slide img {
      width: 100%;
      height: 450px;
      object-fit: cover;
      display: block;
    }

    .botones {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
    }

    .boton {
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      padding: 12px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      margin: 0 10px;
    }

    .boton:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

<div class="carrusel">
  <div class="slides" id="slides">
    <div class="slide">
      <img src="https://cdn.pixabay.com/photo/2017/08/06/11/35/colombia-2591164_1280.jpg" alt="Paisaje 1">
    </div>
    <div class="slide">
      <img src="https://cdn.pixabay.com/photo/2018/09/12/19/00/colombia-3674122_1280.jpg" alt="Paisaje 2">
    </div>
    <div class="slide">
      <img src="https://cdn.pixabay.com/photo/2016/11/29/03/53/colombia-1868781_1280.jpg" alt="Paisaje 3">
    </div>
  </div>
  <div class="botones">
    <button class="boton" onclick="anterior()">❮</button>
    <button class="boton" onclick="siguiente()">❯</button>
  </div>
</div>

<script>
  let index = 0;

  function mostrarSlide(n) {
    const slides = document.getElementById('slides');
    const total = slides.children.length;
    if (n >= total) {
      index = 0;
    } else if (n < 0) {
      index = total - 1;
    } else {
      index = n;
    }
    slides.style.transform = 'translateX(' + (-index * 100) + '%)';
  }

  function siguiente() {
    mostrarSlide(index + 1);
  }

  function anterior() {
    mostrarSlide(index - 1);
  }

  setInterval(siguiente, 4000);
</script>

</body>
</html>
